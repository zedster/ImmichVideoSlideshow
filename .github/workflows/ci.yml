name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          for f in *.php; do
            php -l "$f"
          done

      - name: Validate docker compose
        run: docker compose config
