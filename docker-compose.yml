services:
  immich-video-kiosk:
    image: php:8.2-apache
    ports:
      - "8095:80"
    env_file:
      - .env
    volumes:
      - ./index.php:/var/www/html/index.php:ro
      - ./video.php:/var/www/html/video.php:ro
      - ./watch.php:/var/www/html/watch.php:ro
      - ./favorite.php:/var/www/html/favorite.php:ro
      - ./apache-kiosk.conf:/etc/apache2/conf-enabled/zzz-kiosk.conf:ro
      - ./data:/var/www/html/data
    restart: unless-stopped
